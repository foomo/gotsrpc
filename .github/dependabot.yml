# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2

# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
updates:
  - package-ecosystem: github-actions
    commit-message: { prefix: chore(gha) }
    directory: '/'
    schedule:
      day: sunday
      interval: weekly
      timezone: Europe/Berlin
    groups:
      deps:
        applies-to: version-updates
        patterns: [ "*" ]
      security:
        applies-to: security-updates
        patterns: ['*']
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    commit-message: { prefix: chore(docker) }
    directories: [ "**/*" ]
    schedule:
      day: sunday
      interval: weekly
      timezone: Europe/Berlin
    groups:
      deps:
        applies-to: version-updates
        patterns: [ "*" ]
      security:
        applies-to: security-updates
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    cooldown:
      default-days: 7

  - package-ecosystem: bun
    commit-message: { prefix: chore(bun) }
    directories: [ "**/*" ]
    schedule:
      day: sunday
      interval: weekly
      timezone: Europe/Berlin
    groups:
      deps:
        applies-to: version-updates
        patterns: [ "*" ]
      # NOTE: security updates are currently not supported
      security:
        applies-to: security-updates
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    cooldown:
      default-days: 7
      semver-minor-days: 7
      semver-patch-days: 3

  - package-ecosystem: gomod
    commit-message: { prefix: chore(gomod) }
    directories: [ "**/*" ]
    schedule:
      day: sunday
      interval: weekly
      timezone: Europe/Berlin
    groups:
      deps:
        applies-to: version-updates
        patterns: [ "*" ]
        exclude-patterns: [ "github.com/foomo/*" ]
      foomo:
        applies-to: version-updates
        patterns: [ "github.com/foomo/*" ]
      security:
        applies-to: security-updates
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    cooldown:
      default-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
      exclude: [ "github.com/foomo/*" ]
