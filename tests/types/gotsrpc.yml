module:
  name: github.com/foomo/gotsrpc/v3
  path: ../../

targets:
  types:
    services:
      /service: Service
    package: github.com/foomo/gotsrpc/v3/tests/types/server
    out: ./client/client.ts
    gorpc: [ Service ]
    tsrpc: [ Service ]

mappings:
  github.com/foomo/gotsrpc/v3/tests/types/server:
    out: ./client/vo.ts
  github.com/foomo/gotsrpc/v3/tests/common:
    out: ./client/vo.common.ts
  encoding/json:
    out: ./client/vo.encoding.json.ts
